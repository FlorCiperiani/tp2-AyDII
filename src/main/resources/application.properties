spring.application.name=tp2
# Conexión a la base de datos de XAMPP 
spring.datasource.url=jdbc:mysql://localhost:3306/tp2_clientes?useSSL=false&serverTimezone=UTC

# Por defecto en XAMPP el usuario es 'root'
spring.datasource.username=root

# Por defecto en XAMPP la contraseña está vacía (déjala tal cual o pon tu contraseña si le asignaste una)
spring.datasource.password=

# Configuración de Hibernate para que gestione las tablas automáticamente o valide con el script SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect